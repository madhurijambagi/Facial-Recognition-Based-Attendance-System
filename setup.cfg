[flake8]
max-line-length = 120
exclude = .git,__pycache__,dataset,static,templates,venv,.venv,build,dist
extend-ignore = E203,W503,E221
per-file-ignores =
    tests/*.py:E402
    # model.py is the original, working ML pipeline; its whitespace style is
    # left untouched to avoid risk-for-no-functional-gain churn.
    model.py:E127,E231,W292
