<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Add Student | Digital Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { font-family:'DM Sans',sans-serif; background:#f1f5f9; color:#0f172a; }
    .navbar-custom { background:linear-gradient(90deg,#0f172a,#2563eb); }
    .page-card { background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:2rem; }
    .form-control,.form-select { border-radius:10px; font-family:inherit; }
    .btn-save    { background:linear-gradient(135deg,#2563eb,#4f46e5); border:none; border-radius:10px; }
    .btn-capture { border-radius:10px; }
    .btn-finish  { border-radius:10px; }
    video { border-radius:12px; border:2px solid #e2e8f0; width:100%; max-width:560px; }
    .capture-progress { font-size:.88rem; color:#64748b; margin-top:.5rem; }
    .step-dot {
      width:28px; height:28px; border-radius:50%;
      background:#e2e8f0; color:#94a3b8;
      font-weight:700; font-size:.82rem;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
      transition:background .3s,color .3s;
    }
    .step-dot.active { background:#2563eb; color:#fff; }
    .step-dot.done   { background:#10b981; color:#fff; }
    .step-label { font-size:.88rem; color:#64748b; }
    .step-label.active { color:#0f172a; font-weight:600; }
    .step-row { display:flex; align-items:center; gap:.6rem; margin-bottom:.5rem; }
    .pose-guide {
      font-size:.82rem; color:#64748b; margin-top:.5rem;
      padding:.5rem .9rem; background:#eff6ff;
      border-left:3px solid #2563eb; border-radius:6px;
      min-height:2.2rem; transition:all .3s;
    }
    .pose-guide strong { color:#1d4ed8; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-3 mb-4">
  <a class="navbar-brand fw-bold" href="/">← Dashboard</a>
  <span class="text-white-50 small">Add New Student</span>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="page-card">
        <h4 class="fw-bold mb-1">Add Student &amp; Capture Faces</h4>
        <p class="text-muted small mb-3">
          Fill in student details, then capture <strong>30 face images</strong> with varied poses.
        </p>

        <!-- Steps -->
        <div class="mb-4">
          <div class="step-row"><div class="step-dot active" id="dot1">1</div><span class="step-label active" id="lbl1">Enter student info</span></div>
          <div class="step-row"><div class="step-dot"        id="dot2">2</div><span class="step-label"        id="lbl2">Capture 30 face images</span></div>
          <div class="step-row"><div class="step-dot"        id="dot3">3</div><span class="step-label"        id="lbl3">Complete registration</span></div>
        </div>

        <!-- Step 1: form -->
        <form id="studentForm">
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <input class="form-control" name="name"     placeholder="Full Name *" required/>
            </div>
            <div class="col-md-6">
              <input class="form-control" name="reg_no"   placeholder="Registration Number"/>
            </div>
            <div class="col-md-6">
              <input class="form-control" name="course"   placeholder="Course (e.g. MCA)"/>
            </div>
            <div class="col-md-6">
              <input class="form-control" name="semester" type="number" min="1" max="12" placeholder="Semester"/>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button id="saveInfoBtn"     type="submit" class="btn btn-primary btn-save px-4">Save Info</button>
            <button id="startCaptureBtn" type="button" class="btn btn-warning btn-capture px-4" disabled>Start Capture (30)</button>
            <button id="addStudentBtn"   type="button" class="btn btn-success btn-finish px-4" disabled>✓ Finish</button>
          </div>
        </form>

        <hr class="my-4"/>

        <!-- Step 2: Camera -->
        <div class="text-center">
          <video id="video" autoplay muted playsinline></video>

          <div id="poseGuide" class="pose-guide mt-2 text-start d-none">
            <strong id="poseIcon">📷</strong> <span id="poseText">Look straight at the camera.</span>
          </div>

          <div class="mt-2 capture-progress">
            <div id="captureStatus">Captured 0 / 30</div>
            <div class="progress mt-1" style="height:10px;border-radius:10px;background:#e2e8f0;">
              <div id="progressBar" class="progress-bar"
                   style="width:0%;background:linear-gradient(90deg,#10b981,#059669);border-radius:10px;transition:width .25s ease;">
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
const saveInfoBtn     = document.getElementById("saveInfoBtn");
const startCaptureBtn = document.getElementById("startCaptureBtn");
const addStudentBtn   = document.getElementById("addStudentBtn");
const video           = document.getElementById("video");
const captureStatus   = document.getElementById("captureStatus");
const progressBar     = document.getElementById("progressBar");
const poseGuide       = document.getElementById("poseGuide");
const poseIcon        = document.getElementById("poseIcon");
const poseText        = document.getElementById("poseText");

let student_id = null;
let captured   = 0;
const MAX_IMGS = 30;
let images     = [];
let stream     = null;

// Pose guidance spread across 30 frames
const POSE_SCHEDULE = [
  [0,   9,  "👤", "Look straight at the camera — neutral expression."],
  [10, 17,  "↔️", "Slowly turn head slightly left, then right."],
  [18, 23,  "↕️", "Look slightly up, then slightly down."],
  [24, 29,  "😊", "Smile naturally, then back to neutral."],
];

function updatePoseGuide(frame) {
  const entry = POSE_SCHEDULE.find(([f, t]) => frame >= f && frame <= t);
  if (entry) {
    poseGuide.classList.remove("d-none");
    poseIcon.textContent = entry[2];
    poseText.textContent = entry[3];
  }
}

function setStep(n) {
  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById("dot" + i);
    const lbl = document.getElementById("lbl" + i);
    if (i < n)  { dot.className = "step-dot done";   lbl.className = "step-label"; }
    if (i === n){ dot.className = "step-dot active"; lbl.className = "step-label active"; }
    if (i > n)  { dot.className = "step-dot";         lbl.className = "step-label"; }
  }
}

document.getElementById("studentForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  saveInfoBtn.disabled = true;

  const res = await fetch("/add_student", { method:"POST", body:fd });
  if (!res.ok) {
    alert("Failed to save student info");
    saveInfoBtn.disabled = false;
    return;
  }
  const j    = await res.json();
  student_id = j.student_id;
  setStep(2);
  startCaptureBtn.disabled = false;
  alert("Student info saved ✅  Click 'Start Capture' to open the camera.");
});

startCaptureBtn.addEventListener("click", async () => {
  startCaptureBtn.disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480 } });
    video.srcObject = stream;
    await video.play();
    captureImagesLoop();
  } catch(err) {
    alert("Camera access error: " + err.message);
    startCaptureBtn.disabled = false;
  }
});

async function captureImagesLoop() {
  const canvas = document.createElement("canvas");
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext("2d");

  while (captured < MAX_IMGS) {
    updatePoseGuide(captured);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.90));
    images.push(blob);
    captured++;
    captureStatus.innerText = `Captured ${captured} / ${MAX_IMGS}`;
    progressBar.style.width = `${(captured / MAX_IMGS) * 100}%`;
    await new Promise(r => setTimeout(r, 300));
  }

  const form = new FormData();
  form.append("student_id", student_id);
  images.forEach((b, i) => form.append("images[]", b, `img_${i}.jpg`));
  captureStatus.innerText = "Uploading images…";

  const resp = await fetch("/upload_face", { method:"POST", body:form });
  if (resp.ok) {
    setStep(3);
    addStudentBtn.disabled  = false;
    captureStatus.innerText = "✅ All 30 images uploaded!";
    poseGuide.classList.add("d-none");
  } else {
    alert("Upload failed. Please try again.");
    startCaptureBtn.disabled = false;
    captured = 0; images = [];
  }

  if (stream) stream.getTracks().forEach(t => t.stop());
}

addStudentBtn.addEventListener("click", () => {
  alert("Student registered successfully 🎉\nRemember to re-train the model from the Dashboard.");
  window.location.href = "/";
});
</script>

<script>
// Auto-logout ONLY on true tab/window close — not on internal navigation.
// Any click on an anchor or button that triggers navigation sets this flag,
// which suppresses the beacon for 2 s (enough for the new page to load).
let _navigating = false;
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  const b = e.target.closest("button[onclick], button[type='submit']");
  if (a || b) { _navigating = true; setTimeout(() => { _navigating = false; }, 2000); }
});
// Also catch form submits
document.addEventListener("submit", () => {
  _navigating = true; setTimeout(() => { _navigating = false; }, 2000);
});
window.addEventListener("beforeunload", () => {
  if (!_navigating) navigator.sendBeacon("/session_end");
});
</script>
</body>
</html>
