<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account | Digital Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #2563eb; --brand-h: #1d4ed8; --text: #0f172a;
      --muted: #64748b; --err: #ef4444; --radius: 14px;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg,#dbeafe 0%,#e0e7ff 60%,#f0fdf4 100%);
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 1.5rem;
    }
    body::before, body::after {
      content:''; position:fixed; border-radius:50%;
      filter:blur(80px); opacity:.35; z-index:0;
    }
    body::before { width:500px;height:500px;background:#93c5fd;top:-120px;left:-120px; }
    body::after  { width:400px;height:400px;background:#a5b4fc;bottom:-100px;right:-80px; }

    .card {
      position:relative; z-index:1;
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(16px);
      border-radius:24px;
      box-shadow:0 20px 60px rgba(37,99,235,.12),0 4px 16px rgba(0,0,0,.06);
      padding:2.5rem 2.25rem;
      width:100%; max-width:440px;
      animation:slideUp .45s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }

    .logo { display:flex;align-items:center;gap:.6rem;margin-bottom:1.75rem; }
    .logo-icon { width:44px;height:44px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem; }
    .logo-text { font-family:'Sora',sans-serif;font-size:1.05rem;font-weight:700;color:var(--text);line-height:1.2; }
    .logo-text span { color:var(--brand); }

    h2 { font-family:'Sora',sans-serif;font-size:1.45rem;font-weight:800;color:var(--text);margin-bottom:.3rem; }
    .subtitle { color:var(--muted);font-size:.9rem;margin-bottom:1.75rem; }

    label { display:block;font-size:.83rem;font-weight:600;color:var(--muted);margin-bottom:.4rem;letter-spacing:.03em;text-transform:uppercase; }
    .field { margin-bottom:1.1rem; }

    input[type="email"], input[type="password"], select {
      width:100%; padding:.78rem 1rem;
      border:1.5px solid #e2e8f0; border-radius:var(--radius);
      font-size:1rem; font-family:inherit; color:var(--text);
      background:#f8fafc; transition:border-color .2s,box-shadow .2s; outline:none;
    }
    input:focus, select:focus {
      border-color:var(--brand); box-shadow:0 0 0 3px rgba(37,99,235,.12); background:#fff;
    }

    .btn {
      width:100%; padding:.85rem;
      background:linear-gradient(135deg,#2563eb,#4f46e5);
      color:#fff; border:none; border-radius:var(--radius);
      font-size:1rem; font-weight:600; font-family:inherit;
      cursor:pointer; transition:transform .15s,box-shadow .2s;
      box-shadow:0 4px 14px rgba(37,99,235,.35); margin-top:.4rem;
    }
    .btn:hover { transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.45); }

    .error {
      background:#fef2f2; border:1px solid #fecaca; color:var(--err);
      border-radius:10px; padding:.65rem .9rem; font-size:.88rem; margin-bottom:1rem;
    }
    .footer-link { text-align:center;margin-top:1.4rem;font-size:.9rem;color:var(--muted); }
    .footer-link a { color:var(--brand);font-weight:600;text-decoration:none; }
    .footer-link a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div class="logo-text">Digital<br><span>Attendance</span></div>
    </div>

    <h2>Create Account</h2>
    <p class="subtitle">Register as a teacher to get started</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/signup">
      <div class="field">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@institution.edu" required/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Choose a strong password" required/>
      </div>
      <div class="field">
        <label>Your Teacher Profile</label>
        <select name="reference_id" required>
          <option value="" disabled selected>— Select your name —</option>
          {% for t in teachers %}
          <option value="{{ t.teacher_id }}">{{ t.name }} ({{ t.teacher_id }})</option>
          {% endfor %}
        </select>
      </div>
      <!-- role is always teacher for self-registration -->
      <input type="hidden" name="role" value="teacher"/>
      <button class="btn" type="submit">Create Account</button>
    </form>

    <div class="footer-link">
      Already have an account? <a href="/login">Sign In</a>
    </div>
  </div>
</body>
</html>
